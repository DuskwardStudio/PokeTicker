<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tcgplayer-cdn.tcgplayer.com; connect-src 'self' https://raw.githubusercontent.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#12141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PokéTicker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>PokeTicker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Poké<span>Ticker</span></h1>
  <div class="meta" id="meta">Loading…</div>
  <button id="mask" class="ghost" title="Hide my dollar amounts (for screenshots or card shows)">👁</button>
  <button id="lockbtn" class="ghost" title="Lock the app" hidden>🔒</button>
  <button class="primary" id="refresh">Refresh</button>
</header>
<div class="status" id="status"></div>
<nav id="tabs">
  <button data-tab="home" class="active">Home</button>
  <button data-tab="check">Check</button>
  <button data-tab="port">My Cards</button>
  <button data-tab="deals">Ideas</button>
  <button data-tab="more">More</button>
</nav>
<main><div class="panel" id="view"></div></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Card detail"></aside>
<div id="lockscreen" class="lockscreen" hidden></div>

<script src="core.js" defer></script>
<script src="analysis.js" defer></script>
<script src="security.js" defer></script>
<script src="views-main.js" defer></script>
<script src="views-more.js" defer></script>
<script src="boot.js" defer></script>
</body>
</html>
