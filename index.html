<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PokéTicker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>PokeTicker</title>
<style>
  :root {
    --bg: #12141c; --panel: #1b1f2b; --panel2: #232838; --line: #2e3448;
    --text: #e8ebf5; --muted: #8b93ad; --accent: #ffcb05; --accent2: #3b4cca;
    --up: #3ddc84; --down: #ff5c6c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: linear-gradient(180deg, #1a1e2c, #151824); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; flex: 1; min-width: 180px; }
  button, select, input { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=number] { width: 70px; }
  nav { display: flex; gap: 6px; padding: 12px 20px 0; flex-wrap: wrap; }
  nav button { border-radius: 8px 8px 0 0; border-bottom: none; background: transparent; color: var(--muted); }
  nav button.active { background: var(--panel); color: var(--accent); border-color: var(--line); }
  main { padding: 0 20px 40px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 0 12px 12px 12px; padding: 16px; }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
  .status { margin: 12px 20px 0; padding: 8px 12px; border-radius: 8px; background: var(--panel2); color: var(--muted); font-size: 13px; display: none; }
  .status.show { display: block; }
  .status.err { color: var(--down); }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 18px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; text-decoration: none; color: inherit; }
  .row:hover { background: var(--panel2); }
  .row img { width: 46px; height: 64px; object-fit: cover; border-radius: 4px; background: #0003; flex: none; }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .px { text-align: right; flex: none; }
  .row .px b { display: block; font-size: 15px; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .tile { background: var(--panel2); border-radius: 12px; padding: 12px; }
  .tile .big { font-size: 22px; font-weight: 700; color: var(--accent); }
  .tile .lbl { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .note { color: var(--muted); font-size: 12px; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; }
  .star { cursor: pointer; font-size: 20px; color: var(--muted); padding: 0 4px; user-select: none; flex: none; }
  .star:hover, .star.on { color: var(--accent); }
  .badge { cursor: pointer; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge::before { content: "●"; margin-right: 6px; }
  .badge.on { color: var(--up); } .badge.on::before { animation: pulse 1.6s infinite; }
  .badge.err { color: var(--down); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .livebar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: var(--panel2); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
  .livebar .grow { flex: 1; min-width: 200px; }
  .feed { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; animation: fresh 2s ease-out; }
  .feed:hover { background: var(--panel2); }
  .feed img { width: 34px; height: 48px; object-fit: cover; border-radius: 3px; flex: none; }
  .feed .t { color: var(--muted); font-size: 11px; width: 62px; flex: none; }
  @keyframes fresh { from { background: #ffcb0533; } to { background: transparent; } }
  .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
  .toast { background: var(--panel2); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 14px; max-width: 320px; box-shadow: 0 6px 20px #0008; }
  .searchres .row { padding: 4px 8px; }
  input[type=text] { width: 100%; }
  .sub2 { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; color: var(--muted); margin-bottom: 14px; }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .spark { width: 100%; height: 36px; margin-top: 6px; }
  td.num, th.num { text-align: right; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(580px, 100%); background: var(--panel); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .2s; z-index: 30; overflow-y: auto; padding: 18px; }
  .drawer.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: #0008; z-index: 25; display: none; }
  .scrim.show { display: block; }
  .dhead { display: flex; gap: 14px; align-items: flex-start; }
  .dhead img { width: 110px; border-radius: 6px; flex: none; }
  .dhead h3 { margin: 0 0 4px; font-size: 20px; }
  .xbtn { margin-left: auto; font-size: 18px; padding: 2px 10px; }
  .big2 { font-size: 34px; font-weight: 700; margin: 12px 0 4px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--panel2); font-size: 12px; margin-right: 6px; }
  .rangebtns { display: flex; gap: 6px; margin: 10px 0 4px; }
  .rangebtns button { padding: 3px 10px; font-size: 12px; }
  .rangebtns button.active { border-color: var(--accent); color: var(--accent); }
  .chartbox { position: relative; }
  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font-size: 10px; }
  .tip { position: absolute; top: 4px; left: 50px; font-size: 12px; color: var(--text); background: var(--panel2); padding: 2px 8px; border-radius: 6px; pointer-events: none; opacity: 0; }
  .dsec { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
  .dsec h4 { margin: 0 0 8px; font-size: 14px; }
  .popform { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .popform input { width: 108px; }
  table.scr tr[data-open] { cursor: pointer; }
  table.scr tr[data-open]:hover td { background: var(--panel2); }
  table.scr th[data-sort] { cursor: pointer; user-select: none; }
  table.scr img { width: 26px; height: 36px; object-fit: cover; border-radius: 3px; vertical-align: middle; margin-right: 8px; }
  table.scr .spark { width: 90px; height: 24px; margin: 0; }
  .era { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; margin: 10px 0 6px; cursor: pointer; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: var(--panel2); }
  .era b { font-size: 15px; } .era .sp { flex: 1; }
  .era .spark { width: 110px; height: 28px; margin: 0; }
  .setdetail { background: var(--bg); border-radius: 10px; padding: 14px; margin: 4px 0 12px; }
  .tabrow { cursor: pointer; } .tabrow:hover td { background: var(--panel2); }
  .tile .big.up { color: var(--up); } .tile .big.down { color: var(--down); }
  .sm { display: none; font-size: 12px; margin-top: 2px; }
  .intro { color: var(--muted); font-size: 13px; margin: 0 0 14px; max-width: 70ch; }
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .menu button { text-align: left; padding: 16px; border-radius: 12px; background: var(--panel2); }
  .menu button b { display: block; font-size: 16px; color: var(--accent); margin-bottom: 4px; }
  .menu button span { color: var(--muted); font-size: 13px; }
  .idea { display: flex; gap: 12px; padding: 10px; border-radius: 12px; background: var(--panel2); cursor: pointer; margin-bottom: 8px; align-items: center; }
  .idea img { width: 52px; height: 72px; object-fit: cover; border-radius: 4px; flex: none; }
  .idea .info { flex: 1; min-width: 0; }
  .todo { padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--panel2); border-radius: 0 8px 8px 0; margin-bottom: 6px; font-size: 14px; }
  details.guide { background: var(--panel2); border-radius: 12px; padding: 12px 14px; margin-top: 16px; }
  details.guide summary { cursor: pointer; font-weight: 600; }
  @media (max-width: 760px) {
    body { font-size: 15px; }
    header { padding: 8px 12px; gap: 8px; }
    h1 { font-size: 18px; }
    header .meta { display: none; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 15; padding: 0 0 env(safe-area-inset-bottom, 0px); gap: 0; background: var(--panel); border-top: 1px solid var(--line); justify-content: space-around; flex-wrap: nowrap; }
    nav button { flex: 1; border: 0; border-radius: 0; padding: 13px 2px; font-size: 12px; }
    nav button.active { background: transparent; border-top: 2px solid var(--accent); margin-top: -1px; }
    main { padding: 0 8px 92px; }
    .panel { padding: 12px; border-radius: 12px; margin-top: 10px; }
    .cols { grid-template-columns: 1fr; }
    #view table { display: block; overflow-x: auto; white-space: nowrap; }
    .hm { display: none; }
    .sm { display: block; }
    .popform input, .popform select { flex: 1 1 130px; }
    .drawer { width: 100%; }
    .toasts { bottom: 74px; }
    .tile .big { font-size: 20px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .tile { padding: 10px; }
  }
  td a { color: var(--accent); text-decoration: none; margin-right: 6px; }
  td a:hover { text-decoration: underline; }
  .stat { display: inline-block; margin-right: 18px; } .stat b { display: block; font-size: 17px; }
</style>
</head>
<body>
<header>
  <h1>Poké<span>Ticker</span></h1>
  <div class="meta" id="meta">Loading…</div>
  <span class="badge" id="livebadge" title="Open the Live tab">LIVE</span>
  <label class="meta" style="flex:none">Recent sets
    <select id="setCount"><option>4</option><option selected>8</option><option>12</option></select>
  </label>
  <button class="primary" id="refresh">Refresh now</button>
</header>
<div class="status" id="status"></div>
<nav id="tabs">
  <button data-tab="home" class="active">Home</button>
  <button data-tab="deals">Buy Ideas</button>
  <button data-tab="port">My Cards</button>
  <button data-tab="comps">Sold Prices</button>
  <button data-tab="more">More</button>
</nav>
<main><div class="panel" id="view"></div></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Card detail"></aside>

<script>
(async () => {
const API = 'https://api.pokemontcg.io/v2';
const $ = id => document.getElementById(id);

// ---- storage: IndexedDB (hundreds of MB, scales to thousands of cards) with an in-memory copy; migrates old localStorage data ----
const { mem: MEM, db: DB } = await new Promise(resolve => {
  const mem = {};
  const fallback = () => resolve({ mem, db: null });
  setTimeout(fallback, 4000);   // never let a stuck database block the app from starting
  try {
    const req = indexedDB.open('poketrends', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onerror = fallback;
    req.onsuccess = () => {
      const db = req.result;
      try {
        const tx = db.transaction('kv'), cur = tx.objectStore('kv').openCursor();
        cur.onsuccess = () => { const c = cur.result; if (c) { mem[c.key] = c.value; c.continue(); } };
        tx.oncomplete = () => resolve({ mem, db }); tx.onerror = fallback;
      } catch (e) { fallback(); }
    };
  } catch (e) { fallback(); }
});
if (!Object.keys(MEM).some(k => k.startsWith('pt_'))) {      // first run on this storage: bring over anything saved by older versions
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('pt_')) { try { MEM[k] = JSON.parse(localStorage.getItem(k)); } catch (e) { /* skip */ } } } } catch (e) { /* no localStorage */ }
  if (DB) for (const [k, v] of Object.entries(MEM)) { try { DB.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) { /* ignore */ } }
}
const store = {
  get(k, d) { return k in MEM ? MEM[k] : d; },
  set(k, v) {
    MEM[k] = v;
    if (!DB) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { setTimeout(() => setStatus('Couldn’t save to browser storage — data may be lost when you close the app.', true)); } return; }
    try { const tx = DB.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.onerror = () => setStatus('Couldn’t save data — your disk or browser storage may be full.', true); }
    catch (e) { console.warn('storage', e); }
  }
};
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const usd = n => n == null ? '—' : '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = n => n == null ? '—' : (n > 0 ? '+' : '') + n.toFixed(1) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let state = {
  cards: store.get('pt_cards', {}),   // id -> {n,s,sid,r,num,img,url,cm:{a1,a7,a30}}
  snaps: store.get('pt_snaps', {}),   // date -> {id: price}
  sets: store.get('pt_sets', []),     // [{id,name,releaseDate,count,priced}]
  updated: store.get('pt_updated', null),
  tab: 'port', minPrice: store.get('pt_min', 1),
  deal: { min: 5, rar: '', sig: '', limit: 60 },
  extra: store.get('pt_extra', []),            // set ids the user chose to track daily
  fullDate: store.get('pt_fulldate', null),    // date of last full refresh
  allSets: store.get('pt_allsets', null),      // every set the API knows (id,name,series,releaseDate,printedTotal)
  open: {},                                    // expanded eras / sets in the Eras tab
  sel: null,                                   // card open in the detail drawer
  range: '30',                                 // chart range
  scr: { q: '', era: '', rar: '', sort: 'price', dir: -1, limit: 100 },
  pop: store.get('pt_pop', {})                 // cardId -> [{d, grader, g10, g9, g8, total}]
};

// ---------- live monitoring state ----------
const live = {
  on: store.get('pt_liveon', true),
  interval: store.get('pt_interval', 10),            // minutes
  notify: store.get('pt_notify', false),
  alertPct: store.get('pt_alert', 3),
  watch: store.get('pt_watch', []),                  // card ids
  prices: store.get('pt_live', {}),                  // id -> last seen price
  src: store.get('pt_livesrc', {}),                  // id -> source updatedAt date
  feed: store.get('pt_feed', []),                    // [{t,id,old,p,pct}]
  last: store.get('pt_lastpoll', null), next: Date.now() + 5000,
  polling: false, error: '', unseen: 0, checked: 0
};
function saveLive() {
  store.set('pt_liveon', live.on); store.set('pt_interval', live.interval); store.set('pt_notify', live.notify); store.set('pt_alert', live.alertPct);
  store.set('pt_watch', live.watch); store.set('pt_live', live.prices); store.set('pt_livesrc', live.src); store.set('pt_feed', live.feed); store.set('pt_lastpoll', live.last);
}

function toast(msg) {
  let box = $('toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.className = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; box.appendChild(t);
  setTimeout(() => t.remove(), 9000);
}
function alertUser(title, body, icon) {
  toast(title + ' — ' + body);
  try { if (live.notify && 'Notification' in window && Notification.permission === 'granted') new Notification(title, { body, icon }); } catch (e) { /* ignore */ }
}
function updateBadge() {
  const b = $('livebadge');
  b.className = 'badge' + (!live.on ? '' : live.error ? ' err' : ' on');
  b.textContent = (!live.on ? 'LIVE PAUSED' : live.error ? 'LIVE ERROR' : live.polling ? 'CHECKING…' : 'LIVE') + (live.unseen ? ` · ${live.unseen} new` : '');
  document.title = (live.unseen ? `(${live.unseen}) ` : '') + 'PokeTicker';
}
function pollIds() {
  const dates = Object.keys(state.snaps).sort();
  const cur = dates.length ? state.snaps[dates[dates.length - 1]] : {};
  const top = Object.entries(cur).filter(([id]) => state.cards[id]).sort((a, b) => b[1] - a[1]).slice(0, 100).map(([id]) => id);
  return [...new Set([...live.watch, ...top])];
}
async function livePoll() {
  if (live.polling) return;
  live.polling = true; live.error = ''; updateBadge();
  try {
    const ids = pollIds(); if (!ids.length) throw new Error('No cards yet — run a refresh first.');
    const found = {};
    for (let i = 0; i < ids.length; i += 50) {
      const q = ids.slice(i, i + 50).map(id => 'id:' + id).join(' OR ');
      const data = (await getJson(`${API}/cards?q=${encodeURIComponent(q)}&pageSize=250&select=id,tcgplayer`)).data;
      for (const c of data) { const p = bestPrice(c); if (p != null) found[c.id] = { p, d: c.tcgplayer.updatedAt }; }
    }
    const dates = Object.keys(state.snaps).sort(); const latest = dates.length ? dates[dates.length - 1] : null;
    const base = latest ? state.snaps[latest] : {}; const now = Date.now(); let changes = 0;
    for (const [id, f] of Object.entries(found)) {
      const old = live.prices[id] != null ? live.prices[id] : base[id];
      live.prices[id] = f.p; live.src[id] = f.d;
      if (old != null && old > 0 && Math.abs(f.p - old) >= 0.005) {
        const pc = (f.p - old) / old * 100; changes++;
        live.feed.unshift({ t: now, id, old, p: f.p, pct: pc });
        if (latest === today()) base[id] = f.p;   // keep today's snapshot current
        const c = state.cards[id]; const watched = live.watch.includes(id);
        if ((watched && Math.abs(pc) >= live.alertPct) || (Math.abs(pc) >= 15 && f.p >= 10))
          alertUser(`${watched ? '★ ' : ''}${c.n} ${pc > 0 ? '▲' : '▼'} ${pct(pc)}`, `${usd(old)} → ${usd(f.p)} (${c.s})`, c.img);
      }
    }
    live.feed = live.feed.slice(0, 300);
    if (changes) { live.unseen += state.tab === 'live' ? 0 : changes; if (latest) store.set('pt_snaps', state.snaps); }
    live.last = now; live.checked = Object.keys(found).length;
  } catch (e) { live.error = e.message; }
  live.polling = false; live.next = Date.now() + live.interval * 60000;
  saveLive(); updateBadge(); if (state.tab === 'live') render();
}
function toggleWatch(id) {
  const i = live.watch.indexOf(id); if (i >= 0) live.watch.splice(i, 1); else live.watch.push(id);
  saveLive(); render(); renderDrawer();
}
function ago(ms) { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? s + 's' : s < 3600 ? Math.round(s / 60) + 'm' : Math.round(s / 3600) + 'h'; }

// ---------- collection import (Collectr / Card Ladder CSV exports) ----------
// lots: one row per purchase. {uid, cardId|null, name, set, num, grade, qty, cost (per unit), date, src, kind, val (per-unit manual value|null)}
const port = { lots: store.get('pt_lots', []), sales: store.get('pt_sales', []), hist: store.get('pt_porthist', []), msg: '', edit: null, form: { cardId: null }, showSales: false };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
function savePort() { store.set('pt_lots', port.lots); store.set('pt_sales', port.sales); store.set('pt_porthist', port.hist); }

function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',', '\t', ';'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = '', q = false;
  const endRow = () => { row.push(f); f = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; };
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; endRow(); }
    else f += ch;
  }
  endRow();
  return rows;
}
const COLS = {
  name: ['product name', 'card name', 'name', 'card', 'item', 'description', 'title', 'product'],
  set: ['set name', 'set', 'series', 'group', 'expansion', 'category'],
  num: ['card number', 'number', 'card #', '#', 'no', 'card no'],
  qty: ['quantity', 'qty', 'count', 'owned', 'amount'],
  value: ['market price', 'market value', 'current value', 'current price', 'estimated value', 'latest price', 'price', 'value', 'market', 'current'],
  cost: ['purchase price', 'price bought', 'bought price', 'bought', 'acquisition price','price paid', 'cost basis', 'cost', 'paid', 'purchase cost', 'buy price'],
  grade: ['grade', 'grading', 'condition', 'grade company', 'grader'],
  override: ['price override', 'override'],
  date: ['date added', 'date purchased', 'purchase date', 'date bought', 'date acquired']
};
function mapHeaders(h) {
  const lc = h.map(x => x.trim().toLowerCase()); const m = {}; const used = () => Object.values(m);
  for (const [k, names] of Object.entries(COLS)) for (const n of names) { const i = lc.indexOf(n); if (i >= 0 && !used().includes(i)) { m[k] = i; break; } }
  for (const [k, names] of Object.entries(COLS)) if (m[k] == null)
    for (const n of names) { if (n.length < 4) continue; const i = lc.findIndex((x, j) => x.includes(n) && !used().includes(j)); if (i >= 0) { m[k] = i; break; } }

}
const toNum = x => { const n = parseFloat(String(x ?? '').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; };
const normNum = x => String(x ?? '').split('/')[0].replace(/^#/, '').trim().toLowerCase().replace(/^0+(?=\d)/, '');
const itemKey = it => [it.name, it.set, it.num, it.grade].map(x => String(x || '').toLowerCase()).join('|');

function importCsv(text, src, fileName) {
  const rows = parseCsv(text);
  if (rows.length < 2) throw new Error('That file looks empty.');
  const m = mapHeaders(rows[0]);
  if (m.name == null) throw new Error('Couldn’t find a card-name column. Columns in the file: ' + rows[0].join(', '));
  const get = (r, k) => m[k] == null ? '' : (r[m[k]] ?? '').trim();
  const items = rows.slice(1).map(r => {
    const name = get(r, 'name'); if (!name) return null;
    const hashNum = (name.match(/#\s*([A-Za-z0-9-]+)/) || [])[1];
    const grade = get(r, 'grade'), ov = toNum(get(r, 'override')), cost = toNum(get(r, 'cost')), d = get(r, 'date').slice(0, 10);
    return { name, set: get(r, 'set'), num: normNum(get(r, 'num') || hashNum), grade: /^ungraded$/i.test(grade) ? '' : grade,
      qty: toNum(get(r, 'qty')) ?? 1, value: ov > 0 ? ov : toNum(get(r, 'value')), cost: cost > 0 ? cost : null,   // a 0 cost in an export means "not entered"
      date: /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : today() };
  }).filter(Boolean);
  if (!items.length) throw new Error('No card rows found in that file.');
  // re-importing a source replaces that source's lots (your manual lots are untouched) but keeps costs you typed in
  const oldCost = {}; for (const l of port.lots) if (l.src === src && l.cost != null) oldCost[itemKey(l)] = l.cost;
  port.lots = port.lots.filter(l => l.src !== src);
  for (const it of items) port.lots.push({ uid: uid(), cardId: matchTrackedId(it), name: it.name, set: it.set, num: it.num, grade: it.grade, qty: it.qty, cost: it.cost ?? oldCost[itemKey(it)] ?? null, val: it.value, date: it.date, src, kind: 'card' });
  savePort();
  return { n: items.length, mapped: Object.fromEntries(Object.entries(m).map(([k, i]) => [k, rows[0][i]])) };
}

let trackedIdx = null;
function matchTrackedId(it) {
  if (!trackedIdx) { trackedIdx = {}; for (const [id, c] of Object.entries(state.cards)) (trackedIdx[normNum(c.num)] ||= []).push([id, c]); }
  const cands = trackedIdx[it.num]; if (!cands) return null;
  const nm = it.name.toLowerCase(), st = (it.set || '').toLowerCase();
  const hit = cands.find(([, c]) => nm.includes(c.n.toLowerCase()) && (!st || st.includes(c.s.toLowerCase()) || c.s.toLowerCase().includes(st) || nm.includes(c.s.toLowerCase())));
  return hit ? hit[0] : null;
}
function setStatus(msg, err) { const el = $('status'); el.textContent = msg || ''; el.className = 'status' + (msg ? ' show' : '') + (err ? ' err' : ''); }

async function getJson(url, tries = 4) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 45000);
      const r = await fetch(url, { signal: ctl.signal }); clearTimeout(t);
      if (r.ok) return await r.json();
      last = new Error('HTTP ' + r.status);
    } catch (e) { last = e; }
    await new Promise(r => setTimeout(r, 1200 * (i + 1)));
  }
  throw last;
}

// best USD market price across card variants (holofoil, normal, etc.)
function bestVariant(c) {
  const p = c.tcgplayer && c.tcgplayer.prices; if (!p) return null;
  let best = null;
  for (const [name, v] of Object.entries(p)) { const m = v && (v.market ?? v.mid); if (m != null && (best == null || m > best.market)) best = { name, market: Math.round(m * 100) / 100, low: v.low, mid: v.mid, high: v.high }; }
  return best;
}
function bestPrice(c) { const b = bestVariant(c); return b ? b.market : null; }

// fetch every card of one set into `snap` (id -> price) and `cards` (metadata); throws if the API keeps failing
async function fetchSet(s, snap, cards) {
  let page = 1, got = 0, priced = 0, src = '';
  while (true) {
    const data = (await getJson(`${API}/cards?q=set.id:${s.id}&page=${page}&pageSize=250&select=id,name,number,rarity,images,tcgplayer,cardmarket`)).data;
    for (const c of data) {
      got++;
      const bv = bestVariant(c); if (!bv) continue;
      const cm = c.cardmarket && c.cardmarket.prices;
      const u = c.tcgplayer && c.tcgplayer.updatedAt; if (u && u > src) src = u;
      cards[c.id] = { n: c.name, s: s.name, sid: s.id, ser: s.series || '', r: c.rarity || '', num: c.number, img: c.images && c.images.small, url: (c.tcgplayer && c.tcgplayer.url) || '',
        pr: { v: bv.name, l: bv.low, m: bv.mid, h: bv.high },
        cm: cm && cm.avg7 ? { a1: cm.avg1, a7: cm.avg7, a30: cm.avg30, t: cm.trendPrice } : null };
      snap[c.id] = bv.market; priced++;
    }
    if (data.length < 250) break; page++;
  }
  return { id: s.id, name: s.name, releaseDate: s.releaseDate, series: s.series || '', count: got, priced, srcDate: src };
}

function saveCore() {
  const dates = Object.keys(state.snaps).sort(); while (dates.length > 60) delete state.snaps[dates.shift()];
  store.set('pt_cards', state.cards); store.set('pt_snaps', state.snaps); store.set('pt_sets', state.sets); store.set('pt_updated', state.updated); store.set('pt_extra', state.extra); store.set('pt_fulldate', state.fullDate);
}

async function refresh(auto) {
  const btn = $('refresh'); btn.disabled = true;
  const n = +$('setCount').value; store.set('pt_nsets', n);
  try {
    setStatus('Finding the newest sets…');
    const sets = (await getJson(`${API}/sets?orderBy=-releaseDate&pageSize=${n + 10}&select=id,name,series,releaseDate,total`)).data;
    const nowStr = today().replace(/-/g, '/');
    const recent = sets.filter(s => s.releaseDate <= nowStr);
    const snap = {}; const cards = { ...state.cards }; const setInfo = []; const failed = []; let pricedSets = 0;
    for (let i = 0; i < recent.length && pricedSets < n; i++) {
      setStatus(`Fetching ${recent[i].name} (${pricedSets}/${n} priced sets found)…`);
      try { const info = await fetchSet(recent[i], snap, cards); setInfo.push(info); if (info.priced) pricedSets++; }
      catch (e) { failed.push(recent[i].name); }
    }
    // sets you chose to track from the Eras & Sets tab
    for (const sid of state.extra) {
      if (setInfo.some(x => x.id === sid)) continue;
      const meta = (state.allSets || []).find(x => x.id === sid); if (!meta) continue;
      setStatus(`Fetching tracked set ${meta.name}…`);
      try { setInfo.push(await fetchSet(meta, snap, cards)); } catch (e) { failed.push(meta.name); }
    }
    if (!Object.keys(snap).length) throw new Error('No price data came back (the card API may be having a bad moment). Try again in a few minutes.');
    state.snaps[today()] = snap;
    state.cards = cards; state.sets = setInfo; state.updated = new Date().toISOString(); state.fullDate = today();
    saveCore();
    setStatus(failed.length ? `Updated, but couldn't load: ${failed.join(', ')} (API hiccup — refresh again later).` : '', !!failed.length);
  } catch (e) {
    setStatus('Refresh failed: ' + e.message, true);
  }
  btn.disabled = false; if (port.lots.length) recordPort(); render(); renderDrawer();
}

// ---------- analysis ----------
function analysis() {
  const dates = Object.keys(state.snaps).sort();
  const cur = dates.length ? state.snaps[dates[dates.length - 1]] : {};
  const prevDate = dates.length > 1 ? dates[dates.length - 2] : null;
  const prev = prevDate ? state.snaps[prevDate] : null;
  const weekDate = [...dates].reverse().find(d => (new Date(dates[dates.length - 1]) - new Date(d)) >= 6.5 * 864e5);
  const rows = [];
  for (const [id, price] of Object.entries(cur)) {
    const c = state.cards[id]; if (!c) continue;
    let chg = null, src = '';
    if (prev && prev[id] > 0) { chg = (price - prev[id]) / prev[id] * 100; src = 'vs ' + prevDate; }
    else if (c.cm && c.cm.a7 > 0 && c.cm.a1 != null) { chg = (c.cm.a1 - c.cm.a7) / c.cm.a7 * 100; src = '1d vs 7d avg (Cardmarket)'; }
    let wk = null;
    if (weekDate && state.snaps[weekDate][id] > 0) wk = (price - state.snaps[weekDate][id]) / state.snaps[weekDate][id] * 100;
    rows.push({ id, c, price, chg, src, wk });
  }
  return { rows, dates, prevDate, hasHistory: !!prev };
}

function scoreDeal(r) {

// ---------- outlook: rough "what if I buy today" projections ----------
// An explainable rule-of-thumb model, not a forecast anyone can guarantee. It combines (1) how old the set is, (2) this month's movement,

    return { k, list, head, fv, gk, owned, mkt };
  }).sort((x, y) => y.head.date.localeCompare(x.head.date));
  const boardHtml = board.length ? `<table><tr><th>Item</th><th>Grade</th><th class="num">Comps</th><th class="num">Fair value</th><th class="num">Range</th><th>Last sale</th><th class="num">Trend</th><th class="num">TCG market</th><th class="num">Owned</th></tr>` +
    board.map(g => {
      const open = state.open['comp:' + g.k], mk = g.mkt != null && g.fv ? (g.mkt - g.fv.fv) / g.fv.fv * 100 : null;
      return `<tr class="tabrow" data-toggle="comp:${esc(g.k)}"><td>${open ? '▾' : '▸'} <b>${esc(g.head.name)}</b><div class="sub2" style="margin:0">${esc(g.head.set || '')}</div></td><td>${esc(g.gk)}</td><td class="num">${g.fv.used}${g.fv.n > g.fv.used ? ' / ' + g.fv.n : ''}</td>
        <td class="num"><b>${usd(g.fv.fv)}</b> <span class="pill ${g.fv.conf === 'high' ? 'up' : g.fv.conf === 'low' ? 'down' : ''}">${g.fv.stale ? 'stale' : g.fv.conf}</span></td><td class="num">${usd(g.fv.lo)}–${usd(g.fv.hi)}</td>
        <td>${usd(g.fv.last.price)} · ${esc(g.fv.last.date)}</td><td class="num">${g.fv.trend != null ? chgCell(g.fv.trend) : '—'}</td><td class="num">${g.mkt != null ? usd(g.mkt) + ' ' + chgCell(mk) : '—'}</td><td class="num">${g.owned || '—'}</td></tr>` +
        (open ? `<tr><td colspan="9"><div class="setdetail"><table><tr><th>Sold</th><th class="num">Price</th><th>Source</th><th>Note</th><th></th></tr>${g.list.map(x => `<tr><td>${esc(x.date)}</td><td class="num">${usd(x.price)}</td><td>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.source)} ↗</a>` : esc(x.source)}</td><td>${esc(x.note)}</td><td><a href="#" data-cdel="${esc(x.uid)}" style="color:var(--down)">✕</a></td></tr>`).join('')}</table></div></td></tr>` : '');
    }).join('') + '</table>' : '<div class="empty">No comps yet. Pick an item above, look up its recent sold listings, and log the prices. Three to five recent sales give a trustworthy fair value.</div>';
  const selTxt = f.name ? `${esc(f.name)}${f.set ? ' — ' + esc(f.set) : ''}${f.num ? ' #' + esc(f.num) : ''} · <b>${esc(f.grade)}</b> ${f.cardId ? '· linked to tracked card' : '· custom item'}` : 'Pick or type an item below';
  v.innerHTML = `<p class="intro">When you see a card sell on eBay (or anywhere), log the price here. PokeTicker turns your logged sales into a fair price you can trust, and checks listings against it.</p>
    <div class="dsec" style="margin-top:0;border:0;padding:0"><h2>1 · Choose the item</h2>
      <div class="popform"><input type="text" id="cq" placeholder="Search a tracked card, or type any item name" value="${esc(f.cardId ? `${f.name} — ${f.set} #${f.num}` : f.name)}" style="flex:1;min-width:260px" autocomplete="off">
        <select id="chold"><option value="">…or pick from my holdings</option>${holdings.map((l, i) => `<option value="${i}">${esc(l.name)}${l.grade ? ' (' + esc(gradeKey(l.grade)) + ')' : ''} — ${esc(l.set || '')}</option>`).join('')}</select>
        <select id="cgrade">${GRADES.map(g => `<option${g === f.grade ? ' selected' : ''}>${g}</option>`).join('')}</select></div>
      <div class="searchres" id="cres"></div><div class="sub2" id="csel">${selTxt}</div></div>
    <div class="cols"><div class="dsec"><h2>2 · Log sold comps</h2>
        <div class="popform"><input type="number" id="cprice" min="0" step="0.01" placeholder="Sold price ($)"><input type="date" id="cdate" value="${today()}"><select id="csrc">${SOURCES.map(s => `<option>${s}</option>`).join('')}</select>
          <input type="text" id="curl" placeholder="Link to the sale (optional)" style="flex:1;min-width:160px"><input type="text" id="cnote" placeholder="Note (e.g. best offer, damaged)" style="flex:1;min-width:140px"><button class="primary" id="cadd">Add comp</button></div>
        <div class="sub2">Faster: paste several sales for this item and grade — one per line, like <code>$412.50 10/15/2026</code> or <code>388 2026-10-12 https://…</code></div>
        <textarea id="cbulk" rows="4" placeholder="$412.50 10/15/2026&#10;$399 Oct 12&#10;388 2026-10-09" style="width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit"></textarea>
        <div style="margin-top:6px"><button id="cbulkadd">Add pasted comps</button> <span class="sub2" id="cmsg">${esc(comps.msg)}</span></div></div>
      <div class="dsec"><h2>3 · Check a listing</h2>
        <div class="popform"><input type="number" id="cask" min="0" step="0.01" placeholder="Asking price ($)"><input type="number" id="cship" min="0" step="0.01" placeholder="Shipping to you ($)">
          <label class="sub2" style="margin:0">Selling fee % <input type="number" id="cfee" min="0" step="0.05" value="${comps.fee}" style="width:76px"></label>
          <label class="sub2" style="margin:0">Your shipping/supplies $ <input type="number" id="cout" min="0" step="0.25" value="${comps.shipOut}" style="width:76px"></label></div>
        <div id="cverdict" class="sub2" style="font-size:14px;color:var(--text)"></div></div></div>
    <div class="dsec"><h2>Fair value board <span style="font-size:12px;font-weight:400" class="flat">— median of your last sold comps · ${comps.list.length} comp${comps.list.length === 1 ? '' : 's'} logged</span> <button id="cexport" style="float:right">Export comps (CSV)</button></h2>${boardHtml}
      <p class="note">Fair value is the median of the last up to 7 comps within 90 days (so one lucky or unlucky sale doesn’t move it). It feeds your Portfolio values (◆), the Deals scores and each card’s page. Confidence: 5+ comps high, 3–4 medium, fewer low. Comps are only as good as what you log — match the grade and condition, and skip shill-looking or damaged-copy sales.</p></div>`;
  wireComps(v, rows);
}
function wireComps(v, rows) {
  const f = comps.form, $q = s => v.querySelector(s);
  const verdict = () => {
    const box = $q('#cverdict'), ask = parseFloat($q('#cask').value), ship = parseFloat($q('#cship').value) || 0;
    comps.fee = parseFloat($q('#cfee').value) || 0; comps.shipOut = parseFloat($q('#cout').value) || 0; saveComps();
    if (!f.name) { box.textContent = 'Choose an item first.'; return; }
    const fv = fairValue(f, f.grade);
    if (!fv) { box.textContent = `No sold comps logged yet for ${f.grade} copies of this item — log a few first.`; return; }
    const head = `Fair value <b>${usd(fv.fv)}</b> (${fv.conf} confidence, ${fv.used} comp${fv.used === 1 ? '' : 's'}, range ${usd(fv.lo)}–${usd(fv.hi)}${fv.stale ? ', stale — no sale in 90 days' : ''}).`;
    if (!(ask > 0)) { box.innerHTML = head + ' Enter an asking price to compare.'; return; }
    const cost = ask + ship, vs = (cost - fv.fv) / fv.fv * 100, net = fv.fv * (1 - comps.fee / 100) - comps.shipOut, profit = net - cost, roi = profit / cost * 100;
    const verdictTxt = vs <= -20 ? ['Strong deal', 'up'] : vs <= -10 ? ['Good price', 'up'] : vs <= 0 ? ['Fair — thin margin', 'flat'] : ['Overpriced vs your comps', 'down'];
    box.innerHTML = `${head}<br><b class="${verdictTxt[1]}">${verdictTxt[0]}</b> — your cost ${usd(cost)} is <span class="${vs <= 0 ? 'up' : 'down'}">${pct(vs)}</span> vs fair value. If it resells at fair value: net ${usd(net)} after ${comps.fee}% fees and ${usd(comps.shipOut)} shipping → <b class="${profit >= 0 ? 'up' : 'down'}">${profit >= 0 ? '+' : '−'}${usd(Math.abs(profit))} (${pct(roi)} ROI)</b>.${fv.conf === 'low' ? ' <span class="down">Low confidence — log more comps before trusting this.</span>' : ''}`;
  };
  // item picker
  const cq = $q('#cq'), res = $q('#cres'), setSel = () => { $q('#csel').innerHTML = f.name ? `${esc(f.name)}${f.set ? ' — ' + esc(f.set) : ''}${f.num ? ' #' + esc(f.num) : ''} · <b>${esc(f.grade)}</b> ${f.cardId ? '· linked to tracked card' : '· custom item'}` : 'Pick or type an item below'; verdict(); };
  cq.oninput = () => {
    Object.assign(f, { cardId: null, name: cq.value.trim(), set: '', num: '' }); setSel();
    const q = cq.value.trim().toLowerCase(); if (q.length < 2 || !rows.length) { res.innerHTML = ''; return; }
    const hits = rows.filter(r => (r.c.n + ' ' + r.c.s + ' ' + r.c.num).toLowerCase().includes(q)).sort((x, y) => y.price - x.price).slice(0, 8);
    res.innerHTML = hits.map(r => `<a class="row" href="#" data-pick="${esc(r.id)}"><img src="${esc(r.c.img || '')}" alt=""><div class="info"><div class="name">${esc(r.c.n)}</div><div class="sub">${esc(r.c.s)} · #${esc(r.c.num)} · ${esc(r.c.r || '')}</div></div><div class="px"><b>${usd(r.price)}</b></div></a>`).join('');
    res.querySelectorAll('[data-pick]').forEach(a2 => a2.onclick = e => { e.preventDefault(); const c = state.cards[a2.dataset.pick]; Object.assign(f, { cardId: a2.dataset.pick, name: c.n, set: c.s, num: c.num }); cq.value = `${c.n} — ${c.s} #${c.num}`; res.innerHTML = ''; setSel(); });
  };
  const holdings = [...new Map(port.lots.map(l => [nkey(l) + '|' + gradeKey(l.grade), l])).values()];
  $q('#chold').onchange = e => { const l = holdings[+e.target.value]; if (!l) return; Object.assign(f, { cardId: l.cardId || null, name: l.name, set: l.set || '', num: l.num || '', grade: gradeKey(l.grade) }); renderComps(v.closest('#view') || v, lastA); };
  $q('#cgrade').onchange = e => { f.grade = e.target.value; setSel(); };
  // log comps
  const done = msg => { comps.msg = msg; saveComps(); renderComps(v, lastA); };
  $q('#cadd').onclick = () => {
    if (!f.name) { toast('Choose the item first.'); return; }
    const p = parseFloat($q('#cprice').value); if (!(p > 0)) { toast('Enter the sold price.'); return; }
    const d = $q('#cdate').value || today();
    addComp(f, f.grade, p, d > today() ? today() : d, $q('#csrc').value, $q('#curl').value.trim(), $q('#cnote').value.trim());
    done(`Added ${usd(p)} for ${f.name} (${f.grade}).`);
  };
  $q('#cbulkadd').onclick = () => {
    if (!f.name) { toast('Choose the item first.'); return; }
    const items = parseCompLines($q('#cbulk').value); if (!items.length) { toast('No prices found — put one sale per line, e.g. $412.50 10/15/2026'); return; }
    items.forEach(it => addComp(f, f.grade, it.price, it.date, $q('#csrc').value, it.url, ''));
    done(`Added ${items.length} comp${items.length === 1 ? '' : 's'} for ${f.name} (${f.grade}).`);
  };
  v.querySelectorAll('[data-cdel]').forEach(a2 => a2.onclick = e => { e.preventDefault(); e.stopPropagation(); comps.list = comps.list.filter(x => x.uid !== a2.dataset.cdel); saveComps(); render(); });
  ['#cask', '#cship', '#cfee', '#cout'].forEach(s => { $q(s).oninput = verdict; });
  $q('#cexport').onclick = () => download(`poketicker-comps-${today()}.csv`, [['Date sold', 'Item', 'Set', 'Number', 'Grade', 'Price', 'Source', 'URL', 'Note'], ...comps.list.map(c => [c.date, c.name, c.set, c.num, c.grade, c.price, c.source, c.url, c.note])].map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv');
  verdict();
}

// ---------- views ----------
let lastA = null;
function render() {
  const a = analysis(); lastA = a;
  const upd = state.updated ? new Date(state.updated).toLocaleString() : 'never';
  $('meta').textContent = `Last updated: ${upd} · ${Object.keys(state.cards).length} cards tracked · ${a.dates.length} daily snapshot${a.dates.length === 1 ? '' : 's'}`;
  const navTab = ['market', 'sets', 'live'].includes(state.tab) ? 'more' : state.tab;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === navTab));
  if (a.rows.length && state.fullDate === today()) logPredictions(a);
  const v = $('view');
  if (!a.rows.length && !['port', 'sets', 'comps', 'home', 'more'].includes(state.tab)) { v.innerHTML = '<div class="empty">No data yet. Hit <b>Refresh now</b> to pull today\'s prices.</div>'; return; }
  if (state.tab === 'live') {
    live.unseen = 0; updateBadge();
    const byId = Object.fromEntries(a.rows.map(r => [r.id, r]));
    const srcDates = Object.values(live.src).sort(); const srcNewest = srcDates.length ? srcDates[srcDates.length - 1] : (state.sets.map(s => s.srcDate).filter(Boolean).sort().pop() || '');
    const feedHtml = live.feed.length ? live.feed.slice(0, 60).map(f => {
      const c = state.cards[f.id]; if (!c) return '';
      const cls = f.pct > 0 ? 'up' : 'down';
      return `<a class="feed" data-open="${esc(f.id)}" ${c.url ? `href="${esc(c.url)}" target="_blank" rel="noopener"` : ''} style="text-decoration:none;color:inherit"><span class="t">${new Date(f.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span><img src="${esc(c.img || '')}" alt=""><div class="info" style="flex:1;min-width:0"><div class="name" style="font-weight:600">${esc(c.n)}</div><div class="sub" style="color:var(--muted);font-size:12px">${esc(c.s)} · ${usd(f.old)} → ${usd(f.p)}</div></div><b class="${cls}">${pct(f.pct)}</b></a>`;
    }).join('') : '<div class="empty">No price changes detected yet. The price source publishes updates in bursts (about once a day), so this feed fills in when new prices land — keep the app open.</div>';
    const watchRows = live.watch.map(id => byId[id]).filter(Boolean);
    const watchHtml = watchRows.length ? watchRows.map(r => rowHtml({ ...r, price: live.prices[r.id] ?? r.price }, 'value')).join('')
      : '<div class="empty">Click ☆ on any card (or search above) to watch it. Watched cards are always checked and trigger alerts.</div>';
    v.innerHTML = `<div class="livebar">
        <div class="grow"><b>${live.on ? 'Live monitoring is ON' : 'Live monitoring is paused'}</b> — checking <b>${pollIds().length}</b> cards (your watchlist + top 100 by value)<br>
          <span class="flat">Last check: ${live.last ? new Date(live.last).toLocaleTimeString() : 'not yet'} · Next in <span id="cd">—</span>${live.error ? ` · <span class="down">${esc(live.error)}</span>` : ''}</span></div>
        <label>Every <select id="liveint">${[5, 10, 15, 30, 60].map(m => `<option value="${m}"${m === live.interval ? ' selected' : ''}>${m} min</option>`).join('')}</select></label>
        <button id="livetoggle">${live.on ? 'Pause' : 'Resume'}</button><button id="livenow" ${live.polling ? 'disabled' : ''}>Check now</button>
        <label><input type="checkbox" id="livenotify" ${live.notify ? 'checked' : ''}> Windows notifications</label>
        <label>Alert on watched ≥ <input type="number" id="livealert" min="0.1" step="0.5" value="${live.alertPct}">%</label>
      </div>
      <p class="sub2">Price source last updated: <b>${esc(srcNewest || 'unknown')}</b>. This data (TCGplayer via pokemontcg.io) is refreshed by the provider about once a day, so “live” means PokeTicker catches each change within minutes of it being published — not tick-by-tick.</p>
      <div class="cols"><div><h2>⚡ Live change feed</h2>${feedHtml}</div>
      <div><h2>★ Watchlist</h2><input type="text" id="wsearch" placeholder="Search a card name to watch…"><div class="searchres" id="sres"></div><div style="margin-top:8px">${watchHtml}</div></div></div>`;
    $('liveint').onchange = e => { live.interval = +e.target.value; live.next = Date.now() + live.interval * 60000; saveLive(); render(); };
    $('livetoggle').onclick = () => { live.on = !live.on; live.next = Date.now() + 1000; saveLive(); updateBadge(); render(); };
    $('livenow').onclick = () => livePoll();
    $('livealert').onchange = e => { live.alertPct = Math.max(0.1, +e.target.value || 3); saveLive(); };
    $('livenotify').onchange = async e => {
      live.notify = e.target.checked;
      if (live.notify && 'Notification' in window && Notification.permission === 'default') { try { await Notification.requestPermission(); } catch (x) { /* ignore */ } }
      if (live.notify && (!('Notification' in window) || Notification.permission !== 'granted')) toast('Windows blocked notifications for this app — in-app alerts will still pop up.');
      saveLive();
    };
    $('wsearch').oninput = e => {
      const q = e.target.value.trim().toLowerCase(); const res = $('sres');
      if (q.length < 2) { res.innerHTML = ''; return; }
      res.innerHTML = a.rows.filter(r => r.c.n.toLowerCase().includes(q)).sort((x, y) => y.price - x.price).slice(0, 8).map(r => rowHtml(r, 'value')).join('') || '<div class="empty">No match.</div>';
    };
  } else if (state.tab === 'port') {
    renderPortfolio(v);
  } else if (state.tab === 'deals') {
    renderDeals(v, a);
  } else if (state.tab === 'home') {
    renderHome(v, a);
  } else if (state.tab === 'more') {
    renderMore(v);
  } else if (state.tab === 'comps') {
    renderComps(v, a);
  } else if (state.tab === 'market') {
    const eras = ERA_GROUPS.map(g => g[0]).filter(e => a.rows.some(r => eraOfCard(r.c) === e));
    const rars = [...new Set(a.rows.map(r => r.c.r).filter(Boolean))].sort();
    v.innerHTML = `<div class="toolbar"><input type="text" id="sq" placeholder="Search card or set…" value="${esc(state.scr.q)}" style="width:220px">
        <select id="sera"><option value="">All eras</option>${eras.map(e => `<option${e === state.scr.era ? ' selected' : ''}>${esc(e)}</option>`).join('')}</select>
        <select id="srar"><option value="">All rarities</option>${rars.map(e => `<option${e === state.scr.rar ? ' selected' : ''}>${esc(e)}</option>`).join('')}</select>
        <span>Min $<input type="number" id="minp" min="0" step="0.5" value="${state.minPrice}"></span></div><div id="scrbody"></div>`;
    $('sq').oninput = e => { state.scr.q = e.target.value; state.scr.limit = 100; drawScreener(); };
    $('sera').onchange = e => { state.scr.era = e.target.value; state.scr.limit = 100; drawScreener(); };
    $('srar').onchange = e => { state.scr.rar = e.target.value; state.scr.limit = 100; drawScreener(); };
    $('minp').onchange = e => { state.minPrice = Math.max(0, +e.target.value || 0); store.set('pt_min', state.minPrice); state.scr.limit = 100; drawScreener(); };
    drawScreener();
  } else if (state.tab === 'sets') {
    v.innerHTML = eraView(a);
  }
}

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
$('refresh').onclick = () => refresh(false);
$('livebadge').onclick = () => { state.tab = 'live'; render(); };
$('view').addEventListener('click', e => {
  const s = e.target.closest('.star');
  if (s) { e.preventDefault(); e.stopPropagation(); toggleWatch(s.dataset.id); return; }
  const tr = e.target.closest('[data-track]'); if (tr) { e.preventDefault(); trackSet(tr.dataset.track); return; }
  const ut = e.target.closest('[data-untrack]'); if (ut) { e.preventDefault(); untrackSet(ut.dataset.untrack); return; }
  const tg = e.target.closest('[data-toggle]');
  if (tg) { const k = tg.dataset.toggle; const cur = k in state.open ? state.open[k] : (k.startsWith('era:') && tg.textContent.includes('▾')); state.open[k] = !cur; render(); return; }
  const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); state.tab = go.dataset.go; render(); window.scrollTo(0, 0); return; }
  const op = e.target.closest('[data-open]'); if (op) { e.preventDefault(); openCard(op.dataset.open); }
});
$('drawer').addEventListener('click', e => {
  const s = e.target.closest('.star'); if (s) { e.preventDefault(); toggleWatch(s.dataset.id); }
});
$('scrim').onclick = closeCard;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sel) closeCard(); });
$('setCount').value = String(store.get('pt_nsets', 8));
state.tab = 'home';
loadAllSets(); loadFx();
render(); updateBadge();
// live loop: one 1-second ticker drives the countdown and triggers polls (also catches up after sleep)
setInterval(() => {
  const cd = $('cd'); if (cd) cd.textContent = live.polling ? 'checking…' : live.on ? ago(live.next - Date.now()) : 'paused';
  if (live.on && !live.polling && Date.now() >= live.next && !$('refresh').disabled) livePoll();
}, 1000);
// daily auto-refresh: on open if no snapshot today, and every 6h while the app stays open
if (state.fullDate !== today()) refresh(true);
setInterval(() => { if (state.fullDate !== today() || Date.now() - new Date(state.updated).getTime() > 6 * 36e5) refresh(true); }, 30 * 60 * 1000);
// installable app: offline shell + ask the browser to keep this app's data (so it isn't cleared when space is low)
if (location.protocol.startsWith('http')) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
}
window.__pt = { state, live, port, fx, preds, comps, trackRecord, outlook,refresh, render, renderDrawer, livePoll, importCsv, portSummary, scoreDeal, lastA: () => lastA, store };   // debug handle
})();
</script>
